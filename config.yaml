# ============================================================
#  Document Validation Tool — Master Configuration
#  Edit this file to point the tool at your application.
#  All selectors are CSS selectors (preferred) or XPath.
# ============================================================

# ------------------------------------------------------------------
# Application Entry Point
# ------------------------------------------------------------------
app:
  url: "http://localhost:8080"            # ← CHANGE: full URL to the document list page
  title_contains: ""                      # optional: page <title> fragment to verify correct page

  # Set authenticated: true if you are already logged in when the
  # browser opens (e.g., Windows SSO / session cookie reuse).
  authenticated: true

  login:
    username_selector: "#username"        # ← CHANGE: CSS selector for the username field
    password_selector: "#password"        # ← CHANGE: CSS selector for the password field
    submit_selector: "button[type=submit]" # ← CHANGE
    success_selector: ".doc-list"         # element that proves login succeeded
    username: ""                          # ← CHANGE (or use env var VALIDATOR_USER)
    password: ""                          # ← CHANGE (or use env var VALIDATOR_PASS)

  # How long (ms) to wait for page / element loads before timing out
  timeouts:
    page_load: 30000
    element_visible: 15000
    pdf_load: 20000
    section_load: 20000

# ------------------------------------------------------------------
# Document List
# ------------------------------------------------------------------
document_list:
  # The scrollable container that holds all document rows
  container_selector: ".document-list"   # ← CHANGE

  # Each collapsed document row
  row_selector: ".document-row"          # ← CHANGE

  # A stable, unique identifier visible on every collapsed row
  # (e.g., claim number, case ID). Used in reports and checkpoints.
  row_id_selector: ".doc-id"             # ← CHANGE

  # Button/element to click to expand a collapsed row
  expand_trigger_selector: ".doc-row-expand" # ← CHANGE

  # Selector that confirms a row is fully expanded and loaded
  expanded_indicator_selector: ".doc-expanded" # ← CHANGE

  # Button/element to click to collapse an expanded row
  collapse_trigger_selector: ".doc-row-collapse" # ← CHANGE

  # --- Pagination / lazy loading ---
  pagination:
    type: "infinite_scroll"  # Options: "infinite_scroll" | "load_more" | "none"
    load_more_selector: ".load-more-btn"  # only needed for type: load_more
    scroll_pause_ms: 1500                 # wait after scrolling before checking for new rows
    stable_after_attempts: 3             # stop scrolling if row count unchanged N times

# ------------------------------------------------------------------
# UI Sections (19 sections)
# Fill in all 19. Duplicate the block below for each section.
# ------------------------------------------------------------------
ui_sections:
  # Selector that must be present on ALL 19 sections before extraction starts.
  # If sections load progressively, use the last section's selector here.
  all_loaded_indicator: ".ui-sections-loaded"  # ← CHANGE

  sections:
    - name: "Section 1"                   # ← CHANGE to real section name
      container_selector: ".section-1"    # ← CHANGE
      # How to extract label→value pairs within this section:
      label_selector: ".field-label"      # ← CHANGE
      value_selector: ".field-value"      # ← CHANGE

