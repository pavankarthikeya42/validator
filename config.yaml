# ------------------------------------------------------------------
# PDF Viewer
# ------------------------------------------------------------------
pdf:
  # Strategy: "iframe_src"  → download PDF bytes via src URL + pdfplumber
  #           "pdfjs_dom"   → scrape text from PDF.js .textLayer spans in DOM
  #           "auto"        → try pdfjs_dom first, fall back to iframe_src
  strategy: "auto"

  # Selector for the <iframe> or <embed> wrapping the PDF viewer
  iframe_selector: "iframe.pdf-viewer"   # ← CHANGE

  # (pdfjs_dom only) selector for the text layer spans inside the iframe
  pdfjs_text_selector: ".page .textLayer span"

  # Wait for this selector to confirm the PDF has finished rendering
  pdf_loaded_indicator: ".page"          # ← CHANGE

# ------------------------------------------------------------------
# Field Mappings
# Maps UI section fields to PDF regex patterns.
# ui_path format: "<Section Name> > <Label>"
# pdf_regex: Python re pattern with ONE capturing group for the value.
# normalise: if true, strip extra whitespace and compare case-insensitively
# ------------------------------------------------------------------
field_mappings: []

# ------------------------------------------------------------------
# Table Mappings
# Maps UI tables to PDF tables for row-by-row validation.
# ui_selector: CSS selector for the <table> or container grid in the UI.
# pdf_table_index: 0-based index of the table in the PDF (0 = first table).
# normalise: if true, strip extra whitespace and compare case-insensitively
# ------------------------------------------------------------------
table_mappings:
  # - name: "Chatbot Table"
  #   ui_selector: ".cmp-table"
  #   pdf_table_index: 0
  #   normalise: true

# ------------------------------------------------------------------
# Validation
# Heading-anchored matching: the first heading of each UI section (e.g.
# "1. Executive Summary") anchors it to the same heading in the PDF, and only
# the text under that heading is compared. Extra numbered headings inside a
# section (e.g. "2.3 Executive Summary") are anchored and compared separately.
# Used when field_mappings is empty.
# ------------------------------------------------------------------
validation:
  section_matching: true
  match_threshold: 0.85          # literal block similarity required for MATCH
  semantic_threshold: 0.75       # cosine similarity required for MATCH
  semantic_model: "all-MiniLM-L6-v2"
  # Sections compared by meaning rather than heading-anchored text
  semantic_sections:
    - "Metadata"
    - "Indication"

# ------------------------------------------------------------------
# Output
# ------------------------------------------------------------------
output:
  directory: "./reports"
  screenshots_dir: "./reports/screenshots"
  json_report: "results.json"
  csv_report: "results.csv"
  html_report: "report.html"
  excel_report: "results.xlsx"

# ------------------------------------------------------------------
# Browser Settings
# ------------------------------------------------------------------
browser:
  headless: false          # set true for unattended server runs
  slow_mo: 0               # ms delay between actions (useful for debugging)
  viewport_width: 1920
  viewport_height: 1080
  user_data_dir: ""        # leave blank; set to a Chrome profile path to reuse cookies
