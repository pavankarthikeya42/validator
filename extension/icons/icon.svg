<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#g)"/>
  <!-- Pen body -->
  <g transform="translate(64,64) rotate(-45) translate(-20,-36)">
    <rect x="12" y="8" width="16" height="44" rx="2" fill="white" opacity="0.95"/>
    <!-- Tip -->
    <polygon points="12,52 20,68 28,52" fill="white" opacity="0.95"/>
    <!-- Eraser -->
    <rect x="12" y="4" width="16" height="8" rx="2" fill="#e2e8f0" opacity="0.8"/>
    <!-- Clip line -->
    <rect x="20" y="8" width="2" height="44" fill="#c4b5fd" opacity="0.5"/>
  </g>
</svg>
